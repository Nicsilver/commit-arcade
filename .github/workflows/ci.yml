name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: dist is up to date
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "::error::dist/ is stale, run npm run build and commit it" && exit 1)
