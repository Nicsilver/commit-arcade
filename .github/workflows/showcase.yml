name: Showcase

# Renders every game on the repo owner's graph so the README always shows the latest build.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [dist/**]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          outputs: |
            out/snake.svg?game=snake&theme=github-dark
            out/snake-light.svg?game=snake&theme=github-light
            out/pacman.svg?game=pacman&theme=github-dark
            out/pacman-light.svg?game=pacman&theme=github-light
            out/breakout.svg?game=breakout&theme=github-dark
            out/breakout-light.svg?game=breakout&theme=github-light
            out/invaders.svg?game=invaders&theme=github-dark
            out/invaders-light.svg?game=invaders&theme=github-light
            out/asteroids.svg?game=asteroids&theme=github-dark
            out/asteroids-light.svg?game=asteroids&theme=github-light
            out/neon.svg?game=daily&theme=neon
      - name: Publish to the output branch
        run: |
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Render showcase"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
